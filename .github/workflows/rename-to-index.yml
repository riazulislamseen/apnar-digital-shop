name: Rename sales page to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename sales-page.html to index.html
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/riazulislamseen/apnar-digital-shop.git" repo
          cd repo
          git config user.name "riazulislamseen"
          git config user.email "riazulislamseen@users.noreply.github.com"
          git mv sales-page.html index.html
          git commit -m "Rename sales-page.html to index.html"
          git push origin main
